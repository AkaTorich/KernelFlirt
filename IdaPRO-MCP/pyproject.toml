[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ida-mcp-server"
version = "0.1.0"
description = "MCP Server for IDA Pro 9 — exposes IDA Pro functionality to LLM clients"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
sse = ["uvicorn>=0.30.0", "starlette>=0.38.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
ida-mcp-server = "ida_mcp.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ida_mcp"]
